<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Utmify -->
  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer
  ></script>

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-TZ8GTJV7');</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garanta sua vaga — Destrave sua Voz</title>

  <link rel="icon" href="img/mm.webp" type="image/webp">
  <link rel="shortcut icon" href="img/mm.webp" type="image/webp">
  <link rel="apple-touch-icon" href="img/mm.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 700px;
      background: radial-gradient(ellipse, rgba(255,130,0,.08) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── LOGO ── */
    .f-logo {
      position: relative;
      z-index: 1;
      margin-bottom: 36px;
    }
    .f-logo img {
      height: 48px;
      width: auto;
    }

    /* ── CARD ── */
    .f-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 28px;
      padding: 44px 38px 38px;
      box-shadow:
        0 40px 100px rgba(0,0,0,.85),
        0 0 0 1px rgba(255,255,255,.03);
    }

    /* Shimmer line no topo */
    .f-card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,154,31,.45), transparent);
      border-radius: 999px;
    }

    /* ── EYEBROW ── */
    .f-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #ff9a1f;
      background: rgba(255,154,31,.09);
      border: 1px solid rgba(255,154,31,.2);
      border-radius: 999px;
      padding: 6px 16px;
      margin-bottom: 22px;
    }
    .f-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ff9a1f;
      animation: blink 2.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .3; transform: scale(.6); }
    }

    /* ── HEADLINE ── */
    .f-title {
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .f-title span { color: #ff9a1f; }

    .f-subtitle {
      font-size: .9rem;
      color: rgba(255,255,255,.55);
      line-height: 1.68;
      margin-bottom: 32px;
    }

    /* ── CAMPOS ── */
    .f-field {
      margin-bottom: 16px;
    }
    .f-field label {
      display: block;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 7px;
    }
    .f-field input {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 14px;
      padding: 15px 18px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none;
    }
    .f-field input::placeholder { color: rgba(255,255,255,.18); }
    .f-field input:focus {
      border-color: rgba(255,154,31,.5);
      background: rgba(255,154,31,.03);
    }

    /* ── BOTÃO ── */
    .f-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 8px;
      padding: 16px 24px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #c87c00, #ff9a1f 55%, #ff6500);
      color: #fff;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 32px rgba(255,154,31,.3);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .f-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 44px rgba(255,154,31,.48);
    }
    .f-btn:active { transform: scale(.98); }
    .f-btn .arrow { font-size: 1rem; transition: transform .2s ease; }
    .f-btn:hover .arrow { transform: translateX(4px); }

    /* ── FEEDBACK ── */
    .f-feedback {
      font-size: .8rem;
      text-align: center;
      margin-top: 12px;
      min-height: 16px;
    }
    .f-feedback.error { color: #ff6b6b; }
    .f-feedback.ok    { color: #68dfa0; }

    /* ── TRUST ── */
    .f-trust {
      text-align: center;
      font-size: .72rem;
      color: rgba(255,255,255,.25);
      margin-top: 18px;
      line-height: 1.55;
    }

    @media (max-width: 520px) {
      .f-card { padding: 36px 22px 30px; }
    }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TZ8GTJV7" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div class="f-logo">
    <a href="index.html">
      <img src="img/logo-320.webp"
           srcset="img/logo-320.webp 320w, img/logo-640.webp 640w"
           sizes="200px"
           alt="Destrave sua Voz"
           width="200" height="73"
           decoding="async">
    </a>
  </div>

  <div class="f-card">

    <div class="f-eyebrow">
      <span class="f-dot"></span>
      Vagas limitadas
    </div>

    <h1 class="f-title">
      Antes de continuar,<br>
      me conta <span>quem é você?</span>
    </h1>

    <p class="f-subtitle">
      Só precisamos de dois dados para garantir sua vaga e te enviar todas as informações da imersão.
    </p>

    <form id="leadForm" novalidate>

      <div class="f-field">
        <label for="fNome">Nome completo</label>
        <input
          type="text"
          id="fNome"
          name="nome"
          required
          autocomplete="name"
          placeholder="Seu nome completo"
        >
      </div>

      <div class="f-field">
        <label for="fCelular">Celular (WhatsApp)</label>
        <input
          type="tel"
          id="fCelular"
          name="celular"
          required
          autocomplete="tel"
          placeholder="(DDD) 9 9999-9999"
        >
      </div>

      <button type="submit" class="f-btn">
        Ver meus ingressos <span class="arrow">→</span>
      </button>

      <p class="f-feedback" id="fFeedback" aria-live="polite"></p>
    </form>

    <p class="f-trust">Seus dados são protegidos e não serão compartilhados.</p>

  </div>

  <script>
    const SHEETS = "https://script.google.com/macros/s/AKfycbyCc_2MgAYfn1DBVWueCZrlKfHLf2nRD_mE1JMv7CxGD1N4MV-b-MajKn4kut5lZH8I/exec";

    const form     = document.getElementById("leadForm");
    const feedback = document.getElementById("fFeedback");

    form.addEventListener("submit", e => {
      e.preventDefault();

      const nome    = document.getElementById("fNome").value.trim();
      const celular = document.getElementById("fCelular").value.trim();

      if (!nome || !celular) {
        feedback.textContent = "Preencha seu nome e celular para continuar.";
        feedback.className = "f-feedback error";
        return;
      }

      const payload = JSON.stringify({
        nome,
        celular,
        origem: "Formulário de captação — Destrave sua Voz",
        pagina: location.pathname,
        datahora: new Date().toISOString(),
        lgpd: true
      });

      try {
        if (navigator.sendBeacon) {
          navigator.sendBeacon(SHEETS, new Blob([payload], { type: "text/plain;charset=utf-8" }));
        } else {
          fetch(SHEETS, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: payload, keepalive: true }).catch(() => {});
        }
      } catch(_) {}

      feedback.textContent = "Ótimo! Levando você aos ingressos...";
      feedback.className = "f-feedback ok";

      setTimeout(() => {
        window.location.href = "ingressos.html";
      }, 400);
    });
  </script>
</body>
</html>
